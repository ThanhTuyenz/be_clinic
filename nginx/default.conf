# Map để nâng cấp kết nối WebSocket (Socket.io realtime / notifications)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _; # Hoặc điền tên miền của bạn (ví dụ: api.vitacare.vn)

    # Giới hạn kích thước file upload (ảnh khám, kết quả xét nghiệm)
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Định tuyến tới Backend NestJS Server
    location / {
        proxy_pass http://server:8011;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Phục vụ trực tiếp thư mục upload tĩnh
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
