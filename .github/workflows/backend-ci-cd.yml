name: Backend CI/CD (AWS ECR & EC2)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Tránh hai lần deploy cùng nhánh chạy đồng thời.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: vitacare-server
  APP_DIR: /home/ubuntu/app

jobs:
  check:
    name: Check pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image without publishing
        run: docker build -t vitacare-backend:check .

  build-and-push:
    name: Build and push to ECR
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate AWS role configuration
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          node <<'NODE'
          const role = (process.env.ROLE_ARN || '').trim();
          const valid = /^arn:aws(?:-us-gov|-cn)?:iam::[0-9]{12}:role\/[A-Za-z0-9+=,.@_\/-]+$/.test(role);
          if (!valid) {
            console.error('::error::AWS_ROLE_ARN không phải ARN role đầy đủ. Kiểm tra secret trong đúng repo; bỏ dấu ngoặc kép và ký tự lạ.');
            process.exit(1);
          }
          console.log('AWS_ROLE_ARN có định dạng hợp lệ. Giá trị không được hiển thị.');
          NODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION_TAG: v1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$VERSION_TAG" .
          docker push "$IMAGE:$VERSION_TAG"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AWS_REGION,ECR_REPOSITORY,APP_DIR
          command_timeout: 20m
          script: |
            set -euo pipefail
            trap 'echo "Deploy thất bại tại dòng $LINENO. Xem thông báo của bước ngay trước đó." >&2' ERR

            echo "[1/5] Kiểm tra thư mục và file môi trường"
            if [ ! -d "$APP_DIR" ]; then
              echo "Thiếu thư mục ứng dụng do Terraform chuẩn bị trên EC2." >&2
              exit 1
            fi
            cd "$APP_DIR"
            if [ ! -s .env.production ]; then
              echo "Thiếu hoặc rỗng .env.production. Hãy chuyển file lên đúng EC2 trước khi deploy." >&2
              exit 1
            fi
            chmod 600 .env.production
            docker compose --env-file .env.production config --quiet

            echo "[2/5] Xác định registry và đăng nhập ECR bằng IAM role của EC2"
            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --region "$AWS_REGION" --query Account --output text)
            ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            if ! docker compose --env-file .env.production config --images \
              | grep -Fxq "$ECR_REGISTRY/$ECR_REPOSITORY:latest"; then
              echo "Image trong Compose không khớp tài khoản, region hoặc repository ECR. Hãy đồng bộ Compose từ Terraform lên EC2." >&2
              exit 1
            fi
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "[3/5] Tải Docker images"
            docker compose --env-file .env.production pull

            echo "[4/5] Khởi động dịch vụ phụ thuộc và chạy migration"
            docker compose --env-file .env.production up -d --wait --wait-timeout 180 redis rabbitmq
            docker compose --env-file .env.production run --rm --no-deps server npx prisma migrate deploy

            echo "[5/5] Cập nhật container và reload Nginx"
            docker compose --env-file .env.production up -d --remove-orphans --wait --wait-timeout 180
            docker compose --env-file .env.production exec -T nginx nginx -s reload
            docker compose --env-file .env.production ps
