name: Backend CI/CD (AWS ECR & EC2)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: vitacare_backend
          VERSION_TAG: v1.0.${{ github.run_number }}
          IMAGE_TAG: latest
        run: |
          # 1. Build Docker image
          docker build -t vitacare_backend:latest .
          
          # 2. Gán cả 2 Tag (Latest và Version tăng dần)
          docker tag vitacare_backend:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag vitacare_backend:latest $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG

          # 3. Push cả 2 Tag lên ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG
      
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: vitacare_backend
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,ECR_REPOSITORY
          script: |
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            
            # Login ECR trên EC2
            aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 412461686047.dkr.ecr.ap-southeast-1.amazonaws.com
            
            # Pull image mới nhất
            docker pull "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
            
            # Chạy container với docker compose
            cd backend
            docker compose run --rm server npx prisma migrate deploy
            docker compose up -d --force-recreate server
            
            # Dọn dẹp image cũ
            docker image prune -f